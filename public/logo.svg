<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Accent Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#amberGrad)" stroke-width="12" opacity="0.4"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#amberGrad)" stroke-width="4" stroke-dasharray="12 12" opacity="0.6"/>

  <!-- Styled Wrap / Kebab Icon & Clock Overlay -->
  <g filter="url(#glow)">
    <!-- Wrap Body -->
    <path d="M160 380 C130 350 140 240 230 150 C310 70 380 90 380 150 C380 230 270 370 180 395 C170 398 162 390 160 380 Z" fill="url(#amberGrad)"/>
    <!-- Wrap Layer Lines -->
    <path d="M190 340 C240 290 320 220 350 180" fill="none" stroke="#FEF3C7" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 370 C270 310 340 230 365 210" fill="none" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Clock Hands Overlay -->
    <circle cx="256" cy="256" r="64" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="8"/>
    <line x1="256" y1="256" x2="256" y2="216" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="288" y2="256" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="8" fill="#FCD34D"/>
  </g>
</svg>
